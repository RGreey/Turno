<!doctype html>
<html lang="es">
  <body
    style="
      margin: 0;
      padding: 0;
      background: #eef0f8;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
      color: #20243a;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #eef0f8; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            width="560"
            cellpadding="0"
            cellspacing="0"
            style="
              background: #ffffff;
              border-radius: 16px;
              border: 1px solid #dfe2f0;
              overflow: hidden;
            "
          >
            <tr>
              <td
                style="
                  background: #0d1b2e;
                  padding: 24px 32px;
                  border-bottom: 4px solid #8b5cf6;
                "
              >
                <span
                  style="
                    color: #ffffff;
                    font-size: 21px;
                    font-weight: 700;
                    letter-spacing: 0.2px;
                  "
                  >Turno</span
                ><span
                  style="
                    display: block;
                    color: #a5b4fc;
                    font-size: 12px;
                    margin-top: 4px;
                  "
                  >Gestión sencilla para tu negocio</span
                >
              </td>
            </tr>
            <tr>
              <td style="padding: 32px 32px 28px">
                <h1
                  style="
                    margin: 0 0 8px;
                    font-size: 23px;
                    line-height: 1.3;
                    font-weight: 750;
                    color: #182039;
                  "
                >
                  Confirma tu cuenta
                </h1>
                <p
                  style="
                    margin: 10px 0;
                    font-size: 15px;
                    color: #4b536b;
                    line-height: 1.65;
                  "
                >
                  Gracias por registrarte en Turno. Confirma tu correo para
                  activar tu cuenta y empezar a gestionar tu negocio.
                </p>
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    margin-top: 20px;
                    padding: 13px 24px;
                    background: #6d4aff;
                    color: #ffffff;
                    border-radius: 8px;
                    font-size: 14px;
                    font-weight: 700;
                    text-decoration: none;
                    box-shadow: 0 4px 10px rgba(109, 74, 255, 0.22);
                  "
                  >Confirmar mi cuenta</a
                >
                <p style="margin: 20px 0 0; font-size: 13px; color: #7b8198">
                  Si no creaste esta cuenta, puedes ignorar este correo.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  background: #f7f7fb;
                  padding: 18px 32px;
                  border-top: 1px solid #e5e7eb;
                "
              >
                <p
                  style="
                    margin: 0;
                    font-size: 12px;
                    color: #7b8198;
                    line-height: 1.5;
                  "
                >
                  Desarrollado con
                  <a
                    href="{{ .SiteURL }}"
                    style="
                      color: #6d4aff;
                      text-decoration: none;
                      font-weight: 600;
                    "
                    >Turno</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
